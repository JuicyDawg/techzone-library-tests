# GitHub Actions workflow for the TechZone library tests.
# It runs automatically every time code is pushed to the main branch.
name: Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Download the repository code onto the GitHub runner
      - name: Check out repository
        uses: actions/checkout@v4

      # Install Node.js 24 (the same major version used locally)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Install the exact package versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Run the Jest unit tests with coverage
      - name: Run tests
        run: npm test

      # Send the coverage report (coverage/lcov.info) to Coveralls.
      # GITHUB_TOKEN is created automatically by GitHub for each run,
      # so no secret token is stored in the public repository.
      # "if: always()" uploads coverage even when some tests fail.
      - name: Upload coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}