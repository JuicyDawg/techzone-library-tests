# GitHub Actions workflow for the TechZone library tests.
# It runs automatically every time code is pushed to the main branch.
name: Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Download the repository code onto the GitHub runner
      - name: Check out repository
        uses: actions/checkout@v4

      # Install Node.js 24 (the same major version used locally)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Install the exact package versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Run the Jest unit tests with coverage
      - name: Run tests
        run: npm test